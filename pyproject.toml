[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-signal"
version = "0.1.0"
description = "Central bank sentiment alpha: NLP-driven signals on rates and equity styles."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Marouane"}]
license = {text = "MIT"}

dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dateutil>=2.9",
    "tqdm>=4.66",
    "hydra-core>=1.3",
    "loguru>=0.7",
    "matplotlib>=3.8",
    "plotly>=5.20",
]

[project.optional-dependencies]
nlp = [
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "spacy>=3.7",
    "bertopic>=0.16",
    "datasets>=2.19",
]
dashboard = [
    "streamlit>=1.35",
]
mlops = [
    "mlflow>=2.13",
    "evidently>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "jupyterlab>=4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
